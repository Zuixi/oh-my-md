name: Setup Rust toolchain
description: Rust toolchain (+ optional components), Tauri Linux system deps, Swatinem cache
inputs:
  toolchain:
    description: Toolchain version (e.g. 1.87.0)
    required: true
  components:
    description: Extra components to install (e.g. rustfmt)
    required: false
    default: ""
runs:
  using: composite
  steps:
    # dtolnay's tags are toolchain versions; pinned by SHA with the version
    # passed explicitly via the toolchain input.
    - uses: dtolnay/rust-toolchain@6a393d88d2772701bf30bc3fd30f9cffa24e5a08 # 1.87.0
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
    - name: Install Tauri Linux system dependencies
      if: ${{ runner.os == 'Linux' }}
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      with:
        workspaces: apps/desktop/src-tauri
