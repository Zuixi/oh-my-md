name: Release

# Tag pushes build all three platforms, sign updater artifacts, and create one
# human-reviewed Draft Release. Manual runs exercise the same builders and
# signing but stop at workflow artifacts.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: macOS Universal DMG
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      RUSTFLAGS: -D warnings
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate tag matches Tauri version
        if: github.event_name == 'push'
        shell: bash
        run: |
          version="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
          test "${{ github.ref_name }}" = "v${version}" || {
            echo "Tag ${{ github.ref_name }} does not match Tauri version v${version}" >&2
            exit 1
          }
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: 1.87.0
      - name: Install macOS Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: ./.github/actions/setup-pnpm
      - name: Validate and stage updater signing key
        env:
          UPDATER_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node scripts/prepare-updater-key.mjs "$RUNNER_TEMP"
      - name: Verify updater signing key
        run: |
          probe="$RUNNER_TEMP/omd-signing-probe"
          printf 'oh-my-md updater signing probe' > "$probe"
          env -u TAURI_SIGNING_PRIVATE_KEY pnpm --filter @omd/desktop tauri signer sign --private-key-path "$TAURI_SIGNING_PRIVATE_KEY" --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" "$probe"
          rm -f "$probe" "$probe.sig"
      - name: Build Universal app and DMG
        run: pnpm --filter @omd/desktop tauri build --target universal-apple-darwin --bundles app,dmg
      - name: Require macOS installer and updater artifacts
        shell: bash
        run: |
          bundle="apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle"
          find "$bundle" -type f -name '*.dmg' -print -quit | grep -q .
          find "$bundle" -type f -name '*.app.tar.gz' -print -quit | grep -q .
          find "$bundle" -type f -name '*.app.tar.gz.sig' -print -quit | grep -q .
      - name: Upload macOS package and signed updater artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-package
          path: |
            apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/**/*.app.tar.gz
            apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/**/*.app.tar.gz.sig
          if-no-files-found: error

  windows:
    name: Windows x64 installers
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      RUSTFLAGS: -D warnings
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Enable long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate tag matches Tauri version
        if: github.event_name == 'push'
        shell: bash
        run: |
          version="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
          test "${{ github.ref_name }}" = "v${version}" || {
            echo "Tag ${{ github.ref_name }} does not match Tauri version v${version}" >&2
            exit 1
          }
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: 1.87.0
      - uses: ./.github/actions/setup-pnpm
      - name: Validate and stage updater signing key
        shell: bash
        env:
          UPDATER_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node scripts/prepare-updater-key.mjs "$RUNNER_TEMP"
      - name: Verify updater signing key
        shell: bash
        run: |
          probe="$RUNNER_TEMP/omd-signing-probe"
          printf 'oh-my-md updater signing probe' > "$probe"
          env -u TAURI_SIGNING_PRIVATE_KEY pnpm --filter @omd/desktop tauri signer sign --private-key-path "$TAURI_SIGNING_PRIVATE_KEY" --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" "$probe"
          rm -f "$probe" "$probe.sig"
      - name: Build x64 NSIS installer
        run: pnpm --filter @omd/desktop tauri build --bundles nsis
      - name: Require Windows installer and updater signature
        shell: bash
        run: |
          bundle="apps/desktop/src-tauri/target/release/bundle"
          find "$bundle" -type f -name '*-setup.exe' -print -quit | grep -q .
          find "$bundle" -type f -name '*-setup.exe.sig' -print -quit | grep -q .
          # The in-app updater deep-links to this exact asset name
          # (windowsSetupAssetUrl); fail the build if it ever drifts.
          version="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
          find "$bundle" -type f -name "oh-my-md_${version}_x64-setup.exe" -print -quit | grep -q . || {
            echo "Expected NSIS asset oh-my-md_${version}_x64-setup.exe not found" >&2
            exit 1
          }
      - name: Upload Windows packages and signed updater artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-packages
          path: |
            apps/desktop/src-tauri/target/release/bundle/**/*-setup.exe
            apps/desktop/src-tauri/target/release/bundle/**/*-setup.exe.sig
          if-no-files-found: error

  linux:
    name: Linux x64 packages
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      RUSTFLAGS: -D warnings
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate tag matches Tauri version
        if: github.event_name == 'push'
        shell: bash
        run: |
          version="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
          test "${{ github.ref_name }}" = "v${version}" || {
            echo "Tag ${{ github.ref_name }} does not match Tauri version v${version}" >&2
            exit 1
          }
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: 1.87.0
      - uses: ./.github/actions/setup-pnpm
      - name: Validate and stage updater signing key
        env:
          UPDATER_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node scripts/prepare-updater-key.mjs "$RUNNER_TEMP"
      - name: Verify updater signing key
        run: |
          probe="$RUNNER_TEMP/omd-signing-probe"
          printf 'oh-my-md updater signing probe' > "$probe"
          env -u TAURI_SIGNING_PRIVATE_KEY pnpm --filter @omd/desktop tauri signer sign --private-key-path "$TAURI_SIGNING_PRIVATE_KEY" --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" "$probe"
          rm -f "$probe" "$probe.sig"
      - name: Build x64 deb and AppImage packages
        run: pnpm --filter @omd/desktop tauri build --bundles deb,appimage
      - name: Require Linux packages and updater artifacts
        run: |
          bundle="apps/desktop/src-tauri/target/release/bundle"
          find "$bundle" -type f -name '*.deb' -print -quit | grep -q .
          find "$bundle" -type f -name '*.AppImage' -print -quit | grep -q .
          find "$bundle" -type f -name '*.AppImage.sig' -print -quit | grep -q .
      - name: Upload Linux packages and signed updater artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-packages
          path: |
            apps/desktop/src-tauri/target/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/**/*.AppImage.sig
          if-no-files-found: error

  publish:
    name: Assemble Draft Release
    if: github.event_name == 'push'
    needs: [macos, windows, linux]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download all platform packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: downloaded
          merge-multiple: true
      - name: Validate and stage complete package set
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          for pattern in '*.dmg' '*-setup.exe' '*.deb' '*.AppImage' '*.app.tar.gz' '*.app.tar.gz.sig' '*-setup.exe.sig' '*.AppImage.sig'; do
            mapfile -d '' matches < <(find downloaded -type f -name "$pattern" -print0)
            test "${#matches[@]}" -gt 0 || {
              echo "Missing required release package or updater artifact: $pattern" >&2
              exit 1
            }
            for package in "${matches[@]}"; do
              name="$(basename "$package")"
              test ! -e "release-assets/$name" || {
                echo "Duplicate release package filename: $name" >&2
                exit 1
              }
              cp "$package" "release-assets/$name"
            done
          done
          # The in-app updater and winget deep-link to this exact asset name;
          # fail the release if the NSIS bundle name ever drifts.
          version="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
          test -f "release-assets/oh-my-md_${version}_x64-setup.exe" || {
            echo "Expected NSIS asset oh-my-md_${version}_x64-setup.exe not staged" >&2
            exit 1
          }
      - name: Generate and validate candidate updater manifest
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
          node scripts/update-manifest.mjs candidate \
            --version "$version" \
            --tag "${{ github.ref_name }}" \
            --assets release-assets \
            --output release-assets/latest.json \
            --pub-date "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node scripts/update-manifest.mjs validate \
            --manifest release-assets/latest.json \
            --version "$version" \
            --tag "${{ github.ref_name }}" \
            --assets release-assets
      - name: Create deterministic checksums over every staged asset
        working-directory: release-assets
        shell: bash
        run: |
          test -f latest.json || {
            echo "missing candidate updater manifest" >&2
            exit 1
          }
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - name: Create Draft Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: true
          name: "oh-my-md ${{ github.ref_name }}"
          body: |
            ## Features

            - **Cross-platform high-DPI PNG export**: Export rendered Markdown documents to PNG on macOS, Windows, and Linux with configurable width, 1x / 2x / 3x pixel density, and user-cancelable native capture (#49).
            - **Math & LaTeX editing overhaul**:
              - Clicking a rendered `$$...$$` math block or `$...$` inline formula jumps the caret to the clicked TeX position (#54).
              - Typing `$$` (including inside blockquotes `> $$`) and pressing `Enter` auto-completes the closing `$$` fence and places the caret on the inner line (#54).
              - Added `Mod-Enter` / `Shift-Enter` shortcuts to close the math popup editor and return focus to the document (#54).

            ## Bug Fixes

            - Let a line starting with `$$` interrupt a running paragraph without requiring a blank line, and keep `toggleCodeBlock` bounded to the active paragraph (#53, #54).
            - Restored visible carets/selections, compact popup height, and stable focus when clicking or pasting inside the `.omd-math-popup` LaTeX editor, including inside blockquotes and lists (#54).
            - Strip and restore `> ` prefixes for multi-line math blocks inside blockquotes across live preview, popup editing, and HTML export (#54).
            - Preserve empty GFM table cells and column alignment (`align="..."`) in synchronous and rich HTML exports (#50).
            - Preserve custom ordered-list start numbers (`<ol start="N">`) in synchronous and rich HTML exports (#51).
            - Normalize Windows CRLF/CR line endings before computing single- and multi-cursor caret offsets during plain-text paste (#52).

            ## Documentation

            - Updated English and Chinese READMEs (`README.md`, `README-zh.md`), manual QA checklists (`docs/manual-qa.md`), and cross-platform high-DPI export design specs.

            ## Install

            Download from [GitHub Releases](https://github.com/Zuixi/oh-my-md/releases/tag/${{ github.ref_name }}). Installed `oh-my-md` (`0.1.0+`) supports in-app updates verified with minisign (confirm download, then confirm restart).

            - **macOS (Apple Silicon & Intel Universal)**: `oh-my-md_0.1.4_universal.dmg`
            - **Windows (x64 NSIS installer)**: `oh-my-md_0.1.4_x64-setup.exe`
            - **Linux (x64)**: `oh-my-md_0.1.4_amd64.AppImage` / `oh-my-md_0.1.4_amd64.deb` (requires GTK 3 and WebKitGTK 4.1)
            - **Checksums & Updater**: `SHA256SUMS.txt` · `latest.json`

            > **Note on unsigned packages**: These packages are not code-signed yet; macOS Gatekeeper or Windows SmartScreen may prompt on first launch. Verify downloads against `SHA256SUMS.txt`.

            Thanks to [@berd2](https://github.com/berd2) (HJ Kim), whose reports and code went into this release (#50, #51, #52, #53). Everyone who helped: [contributors](https://github.com/Zuixi/oh-my-md/graphs/contributors).

            ---

            ## 新功能 (Features)

            - **跨平台高清 PNG 导出**：支持在 macOS、Windows 和 Linux 上将 Markdown 渲染结果导出为高清 PNG，支持自定义导出宽度、1x / 2x / 3x 倍率选择以及原生任务隨時取消 (#49)。
            - **数学公式（Math / LaTeX）编辑体验全面升级**：
              - 点击渲染后的 `$$...$$` 块级公式或 `$...$` 行内公式，光标自动跳转到点击位置对应的 TeX 源码字符偏移处 (#54)。
              - 输入 `$$`（含引用块内 `> $$`）后按 `Enter` 自动补全闭合 `$$` 围栏并将光标置于中间编辑行 (#54)。
              - 公式弹窗支持 `Mod-Enter` / `Shift-Enter` 快捷收起并返回正文焦点 (#54)。

            ## 问题修复 (Bug Fixes)

            - 支持以 `$$` 开头的公式块直接打断上文段落而无需空行，并修复紧邻公式块时代码块切换的范围边界 (#53, #54)。
            - 修复 `.omd-math-popup` 公式弹窗内光标/选区不可见、弹窗底部继承外层 `50vh` 留白，以及在引用块/列表内点击弹窗导致失焦关闭的问题 (#54)。
            - 支持引用块内多行数学公式（`> $$\n> ...\n> $$`）在实时预览、弹窗编辑与 HTML 导出中自动剥离与还原 `> ` 前缀 (#54)。
            - 修复 HTML 导出（同步与富文本）中 GFM 表格空单元格丢失及列对齐属性（`align="..."`）未保留的问题 (#50)。
            - 修复 HTML 导出中非 1 起始的有序列表编号（`<ol start="N">`）丢失的问题 (#51)。
            - 修复粘贴含 Windows `CRLF` 换行符的纯文本时单光标与多光标偏移计算越界的问题 (#52)。

            ## 文档 (Documentation)

            - 更新中英文说明文档（`README.md`、`README-zh.md`）、手动验收清单（`docs/manual-qa.md`）与跨平台高清导出设计规范。

            ## 安装 (Install)

            从 [GitHub Releases](https://github.com/Zuixi/oh-my-md/releases/tag/${{ github.ref_name }}) 下载。已安装的 `oh-my-md`（`0.1.0+`）支持基于 minisign 签名校验的应用内自动更新（确认下载、确认重启后生效）。

            - **macOS (Apple Silicon & Intel 通用包)**: `oh-my-md_0.1.4_universal.dmg`
            - **Windows (x64 安装包)**: `oh-my-md_0.1.4_x64-setup.exe`
            - **Linux (x64)**: `oh-my-md_0.1.4_amd64.AppImage` / `oh-my-md_0.1.4_amd64.deb`（需 GTK 3 与 WebKitGTK 4.1）
            - **校验与更新清单**: `SHA256SUMS.txt` · `latest.json`

            感谢 [@berd2](https://github.com/berd2) (HJ Kim)：这次更新里有你的反馈与代码（#50、#51、#52、#53）。所有贡献者见[贡献墙](https://github.com/Zuixi/oh-my-md/graphs/contributors)。

            ## Upgrading from an MSI install?

            Download and run the `-setup.exe` once — the wizard guides you
            through removing the old MSI installation. If your desktop shows
            two shortcuts afterwards, delete the older one. Silent installs
            (`/S`) refuse to run while an MSI installation is present
            (exit code 1603).
          files: release-assets/*
          fail_on_unmatched_files: true
