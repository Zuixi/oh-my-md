name: SignPath smoke (manual)

on:
  workflow_dispatch:
    inputs:
      signing_policy_slug:
        description: SignPath signing policy slug
        required: true
        default: oh-my-md
        type: string
      artifact_configuration_slug:
        description: Optional SignPath artifact configuration slug
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  signpath-smoke:
    name: Verify SignPath token and signing
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Build minimal PE probe executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force unsigned | Out-Null
          @'
          using System;
          class Program {
            static void Main() { Console.WriteLine("oh-my-md signpath probe"); }
          }
          '@ | Set-Content -Path probe.cs -Encoding UTF8
          & "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /out:unsigned\signpath-probe.exe probe.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload unsigned probe artifact
        id: upload-unsigned
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signpath-probe-unsigned
          path: unsigned/signpath-probe.exe
          retention-days: 1

      - name: Submit signing request to SignPath
        id: sign
        uses: SignPath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: 7bc4c3d3-506d-4490-b57c-6666fa816825
          project-slug: oh-my-md
          signing-policy-slug: ${{ inputs.signing_policy_slug }}
          artifact-configuration-slug: ${{ inputs.artifact_configuration_slug }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          output-artifact-directory: signed
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 180

      - name: Inspect Authenticode signature
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path signed -Recurse -Filter "signpath-probe.exe" | Select-Object -First 1
          if (-not $exe) {
            Write-Error "Signed executable not found under signed/"
            Get-ChildItem -Path signed -Recurse
            exit 1
          }
          $sig = Get-AuthenticodeSignature -FilePath $exe.FullName
          $sig | Format-List Status, StatusMessage, @{N='Subject';E={$_.SignerCertificate.Subject}}, @{N='Issuer';E={$_.SignerCertificate.Issuer}}, @{N='Timestamp';E={$_.TimeStamperCertificate.Subject}}
          if (-not $sig.SignerCertificate) {
            Write-Error "Executable has no Authenticode signature"
            exit 1
          }
