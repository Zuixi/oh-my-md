version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows and .github/actions
  # current (Dependabot bumps SHAs annotated with a `# vX.Y.Z` comment).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"

  # pnpm workspace dependencies, resolved through pnpm-lock.yaml at the root.
  # Grouped into a single monthly minor/patch PR; major upgrades are evaluated manually.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  # Rust crates for the Tauri host (Cargo.toml / Cargo.lock).
  # Grouped into a single monthly minor/patch PR; major upgrades are evaluated manually.
  - package-ecosystem: cargo
    directory: "/apps/desktop/src-tauri"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      cargo-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
